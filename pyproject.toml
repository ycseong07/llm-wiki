[project]
name = "llm-wiki"
version = "0.1.0"
description = "Personal RAG Knowledge System — Windows-side ingest + indexing, Mac-side MCP retrieval."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "keyring>=25",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "google-genai>=0.8",
    "langgraph>=0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
