[project]
name = "llm-wiki"
version = "0.2.0"
description = "Candidate-discovery helper for the Obsidian-based personal wiki. Filters external sources against the user's vault profile and drops survivors into raw/articles/ for manual ingest."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "keyring>=25",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "google-genai>=0.8",
    "requests>=2.32",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
